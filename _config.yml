#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.
#
# ,--------.      ,--.   ,--. ,--.
# '--.  .--',---.  \  `.'  /,-'  '-.
#    |  |  | .-. :  .'    \ '-.  .-'
#    |  |  \   --. /  .'.  \  |  |
#    `--'   `----''--'   '--' `--'




## => Site Settings
##############################
text_skin: default # "default" (default), "dark", "forest", "ocean", "chocolate", "orange"
highlight_theme: default # "default" (default), "tomorrow", "tomorrow-night", "tomorrow-night-eighties", "tomorrow-night-blue", "tomorrow-night-bright"
url     : https://joelsbridge.github.io # TODO: 绑定自定义域名后改这里
baseurl : "/blog" # does not include hostname
title   : 雨落别枫桥 # TODO: 站点标题
description: > # this means to ignore newlines until "Language & timezone"   TODO: 站点描述
  记录技术，也记录生活。


## => Language and Timezone
##############################
lang: zh-Hans # the language of your site, default as "en"
timezone: Asia/Shanghai # see https://en.wikipedia.org/wiki/List_of_tz_database_time_zones for the available values


## => Author and Social
##############################
author:
  type      : person # "person" (default), "organization"
  name      : 雨落别枫桥 # TODO: 你的昵称
  url       :
  avatar    : # TODO: 头像图片路径，如 /assets/images/avatar.png (正方形)
  bio       : 记录技术，也记录生活。 # TODO: 一句话简介
  email     :
  facebook  : # "user_name" the last part of your profile url, e.g. https://www.facebook.com/user_name
  twitter   : # "user_name" the last part of your profile url, e.g. https://twitter.com/user_name
  weibo     : # "user_id"   the last part of your profile url, e.g. https://www.weibo.com/user_id/profile?...
  googleplus: # "user_id"   the last part of your profile url, e.g. https://plus.google.com/u/0/user_id
  telegram  : # "user_name" the last part of your profile url, e.g. https://t.me/user_name
  medium    : # "user_name" the last part of your profile url, e.g. https://medium.com/user_name
  zhihu     : # "user_name" the last part of your profile url, e.g. https://www.zhihu.com/people/user_name
  douban    : # "user_name" the last part of your profile url, e.g. https://www.douban.com/people/user_name
  linkedin  : # "user_name" the last part of your profile url, e.g. https://www.linkedin.com/in/user_name
  github    : joelsbridge # "user_name" the last part of your profile url, e.g. https://github.com/user_name
  npm       : # "user_name" the last part of your profile url, e.g. https://www.npmjs.com/~user_name


## => GitHub Repository (if the site is hosted by GitHub)
##############################
repository: joelsbridge/blog
repository_tree: master


## => Paths
##############################
paths:
  root    : # title link url, "/" (default)
  home    : # home layout url, "/" (default)
  archive : # "/archive.html" (default)
  rss     : # "/feed.xml" (default)


## => Post
##############################
## excerpt
excerpt_separator: <!--more-->

## license
license: CC-BY-NC-4.0 # "CC-BY-4.0", "CC-BY-SA-4.0", "CC-BY-NC-4.0", "CC-BY-ND-4.0"

## TOC
toc:
  selectors: # "h1,h2,h3" (default)


## => Markdown Enhancements
##############################
## Mathjax
mathjax: # false (default), true
mathjax_autoNumber: # false (default), true

## Mermaid
mermaid: # false (default), true

## Chart
chart: # false (default), true


## => Paginate
##############################
paginate: 8
paginate_path: /page:num # don't change this unless for special need


## => Sources
##############################
sources: # bootcdn (default), unpkg


## => Sharing
##############################
sharing:
  provider: false # false (default), "addtoany", "addthis", "custom"

  ## AddThis
  addthis:
    id: # AddThis pubid, e.g. ra-5xxxxxxxxxxx


## => Comments
##############################
comments:
  provider: false # false (default), "disqus", "gitalk", "valine", "custom"

  ## Disqus
  disqus:
    shortname: # the Disqus shortname for the site

  ## Gitalk
  # please refer to https://github.com/gitalk/gitalk for more info.
  gitalk:
    clientID    : # GitHub Application Client ID
    clientSecret: # GitHub Application Client Secret
    repository  : # GitHub repo
    owner       : # GitHub repo owner
    admin: # GitHub repo owner and collaborators, only these guys can initialize GitHub issues, IT IS A LIST.
      # - your GitHub Id

  ## Valine
  # please refer to https://valine.js.org/en/ for more info.
  valine:
    app_id      : # LeanCloud App id
    app_key     : # LeanCloud App key
    placeholder : # Prompt information
    visitor     : # false (default)
    meta        : # "[nick, mail, link]" (default) nickname, E-mail, Personal-site


## => Pageview
##############################
pageview:
  provider: false # false (default), "leancloud", "custom"

  ## Leancloud
  leancloud:
    app_id    : # LeanCloud App id
    app_key   : # LeanCloud App key
    app_class : # LeanCloud App class


## => Search
##############################
search:
  provider: default # "default" (default), false, "google", "custom"

  ## Google Custom Search Engine
  google:
    custom_search_engine_id: # Google Custom Search Engine ID


## => Analytics
##############################
analytics:
  provider: false # false (default), "google", "custom"

  ## Google Analytics
  google:
    tracking_id : # Google Analytics id for the site
    anonymize_ip: false # Anonymize IP tracking for Analytics


## => Build
##############################
markdown    : kramdown
highlighter : rouge
# 全局保持 Jekyll 内置的 "date" 样式。注意它等价于
# /:categories/:year/:month/:day/:title.html —— 分类会进 URL，文章换栏目就会断链。
# 所以【文章的 permalink 在下面 defaults 里单独覆盖】，全局值只用来定义
# 普通页面（tech.html / about.md …）的行为。
#
# ⚠️ 不要把这里的全局值改成自定义字符串（例如 /:year/:month/:day/:title.html）：
# Jekyll 只会把内置样式识别成符号，自定义字符串会让 site.permalink_style 变成 nil，
# 结果是【所有页面】的 url 都丢掉 .html 后缀（page.url 变 /tech 而文件是 tech.html），
# 进而弄坏导航高亮（header.html 拿 page.url 和导航项 URL 做字符串比较）、
# 以及 sitemap 里的页面 URL。文章 URL 的解耦请用 defaults，见下方。
permalink   : date

exclude:
  - DEVELOPMENT.md
  - PROJECT-GUIDE.md
  - CLAUDE.md
  - CHANGELOG.md
  - HOW_TO_RELEASE.md
  - Dockerfile.dev
  - eslint.config.mjs
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README-*.md
  - README.md
  - gulpfile.js
  - jekyll-text-theme.gemspec
  - package-lock.json
  - package.json
  - screenshot.jpg
  - /docker
  - /docs
  - /node_modules
  - /screenshots
  - /test
  - /tools
  - /vendor

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
      # 文章 URL 与栏目解耦：去掉 Jekyll 内置 date 样式里的 :categories 段，
      # 这样把文章从「技术」挪到「生活」不会改变它的 URL，外链不会失效。
      # 页面（tech.html / about.md …）不受影响，仍走全局的 permalink: date。
      permalink: /:year/:month/:day/:title.html
      sharing: true
      license: true
      aside:
        toc: true
      show_edit_on_github: true
      show_subscribe: true
      pageview: true

  ## 栏目分类：Jekyll 不会从 _posts 的子目录推导 categories（它只看 _posts
  ## 的【上层】目录），所以这里按路径显式注入，写作时就不用每篇手写了。
  ## 新增栏目时，在下面照抄一段，并同步新建 <栏目名>.html 和导航项。
  - scope:
      path: "_posts/tech"
      type: posts
    values:
      categories: tech
  - scope:
      path: "_posts/life"
      type: posts
    values:
      categories: life


## => Plugins
##############################
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jemoji
